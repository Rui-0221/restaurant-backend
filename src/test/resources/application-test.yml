spring:
  datasource:
    url: jdbc:mysql://localhost:33306/restaurant_management_test?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
    username: root
    password: restaurant_test_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 36379
      timeout: 500ms

jwt:
  secret: restaurant-test-jwt-secret-at-least-32-characters-long
  expiration: 7200000

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
