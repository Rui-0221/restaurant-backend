spring:
  config:
    # test profile 复用本机开发配置中的数据库凭据；文件不存在时仍可使用 DB_* 环境变量。
    import: optional:classpath:application-local.yml

jwt:
  secret: restaurant-test-jwt-secret-at-least-32-characters-long
  expiration: 7200000

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
