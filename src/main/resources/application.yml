spring:
  profiles:
    active: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/restaurant_management?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Redis 配置（Day8 缓存）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# SpringDoc OpenAPI 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: org.example.restaurant.controller

# Knife4j 配置
knife4j:
  enable: true
  production: false
  setting:
    language: zh_cn
    enable-version: true
    enable-swagger-models: true

# JWT 配置
jwt:
  secret: ${JWT_SECRET:please-change-this-secret-key-in-production-at-least-32-chars}
  expiration: ${JWT_EXPIRATION:7200000}

restaurant:
  ai:
    enabled: ${DEEPSEEK_ENABLED:false}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    connect-timeout: ${DEEPSEEK_CONNECT_TIMEOUT:3s}
    read-timeout: ${DEEPSEEK_READ_TIMEOUT:15s}
    max-tokens: ${DEEPSEEK_MAX_TOKENS:1024}
  ai-ordering:
    state:
      key-prefix: ${AI_ORDER_KEY_PREFIX:restaurant:ai-order:}
      conversation-ttl: ${AI_ORDER_CONVERSATION_TTL:30m}
      proposal-ttl: ${AI_ORDER_PROPOSAL_TTL:10m}
      rate-window: ${AI_ORDER_RATE_WINDOW:1m}
      max-rounds: ${AI_ORDER_MAX_ROUNDS:20}
      max-message-length: ${AI_ORDER_MAX_MESSAGE_LENGTH:500}
      max-conversation-id-length: ${AI_ORDER_MAX_CONVERSATION_ID_LENGTH:64}
      rate-limit: ${AI_ORDER_RATE_LIMIT:10}
